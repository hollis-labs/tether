# Reproduces legacy ~/.tether/catalog/launches/agent-workspaces-claude-stream.yaml.
# Boot-profile folded: (no boot-profile; uses spec default role)
# Legacy: project=agent-workspaces / agent=general / provider=claude-stream / workspace.mode=hybrid.
spec: tether.launch
name: agent-workspaces-claude-stream
inputs:
