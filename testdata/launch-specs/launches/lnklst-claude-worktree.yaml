# Reproduces legacy ~/.tether/catalog/launches/lnklst-claude-worktree.yaml.
# Boot-profile folded: lnklst.backend.main.worktree.yaml
# Legacy: project=lnklst / agent=general / provider=claude-code / workspace.mode=worktree.
spec: tether.launch
name: lnklst-claude-worktree
inputs:
  work_dir: ~/dev/projects/lnklst
  runner: claude-code
  isolation: worktree
  project: lnklst
  agent: general
  agent_role: domain/backend/worker
  display_name: "Lnklst — Backend (Worktree)"
