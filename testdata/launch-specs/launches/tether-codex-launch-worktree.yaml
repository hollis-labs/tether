# Reproduces legacy ~/.tether/catalog/launches/tether-codex-launch-worktree.yaml.
# Boot-profile folded: tether.codex.main.worktree.yaml
# Legacy: project=tether / agent=general / provider=codex-app-server / workspace.mode=worktree.
# Repointed 2026-09-12: the codex-cli provider has no command and no
# auto-detectable binary (`tether doctor` reports it unusable), so every
# launch on it failed. codex-app-server is the framed, steerable path.
spec: tether.launch
name: tether-codex-launch-worktree
inputs:
  work_dir: ~/dev/hollis-labs/apps/tether
  runner: codex-app-server
  isolation: worktree
  project: tether
  agent: general
  agent_role: domain/backend/worker
  display_name: "Tether — Codex App-Server (Worktree)"
