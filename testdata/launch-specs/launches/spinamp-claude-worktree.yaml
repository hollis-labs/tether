# Reproduces legacy ~/.tether/catalog/launches/spinamp-claude-worktree.yaml.
# Boot-profile folded: spinamp.backend.main.worktree.yaml
# Legacy: project=spinamp / agent=general / provider=claude-code / workspace.mode=worktree.
spec: tether.launch
name: spinamp-claude-worktree
