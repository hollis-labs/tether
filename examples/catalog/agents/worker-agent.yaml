id: worker-agent
name: Headless Task Worker
roles: [worker]
skills: []
# Dev-mode headless worker. A headless launch cannot answer permission prompts,
# so permission_mode: default denies every MCP tool call (Torque, Tesseract,
# Tether) and the session idles silently. bypass is the dev-mode posture;
# release-time posture stays strict (explicit MCP allowlist, CW-20261012-0123).
permissions:
  network: true
  permission_mode: bypass
# A finished headless worker has no one to hand off to, so end it once it goes
# quiet instead of leaving it running until someone stops it. The reaper checks
# every five minutes, so the session ends within idle_timeout + 5m of its last
# activity. max_duration is the backstop for a worker that never goes quiet.
lifecycle:
  idle_timeout: 10m
  stop_after_final_turn: 60s
  max_duration: 4h
# Task template default: the closing step is part of the job. Whoever merges the
# work transitions the Torque task (done if merged, review if not), cites the PR
# or commit and what was verified, and records deploy state (CW-20261013-0048).
agent_prompt: |
  Before you stop, close the loop on each Torque task you worked: call
  torque_task_transition (done if merged, review if not) and torque_comment_add
  with the PR or commit, what you verified and the deploy state. File new gaps
  as Torque tasks.
