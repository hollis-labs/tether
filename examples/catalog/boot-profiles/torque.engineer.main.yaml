id: torque.engineer.main
display_name: "Torque — Managed Claude"
launch: torque-claude
mcp_servers: []

identity:
  lineage_alias:   torque.engineer.main
  lineage_id:      ""
  profile_id:      torque-engineer
  profile_version: 1
  role:            backend
  project:         torque
  work_root:       ~/Projects-apps/tether
  tracking_root:   ~/Projects-apps/agent-workspaces/execution/tether/
  tesseract_primary:   "2026-05-14"

slots:
  agent:
    type: role_summary
    path: ~/.nanite/roles/domain/backend/worker.md

  recap:
    type: cmd
    run: |
      if [ -f "$HOME/Projects-apps/agent-workspaces/boot/tether/boot-prompt.md" ]; then
        head -80 "$HOME/Projects-apps/agent-workspaces/boot/tether/boot-prompt.md"
      else
        echo "(no recap available)"
      fi
    timeout: 5s

  history:
    type: cmd
    run: "git -C ~/Projects-apps/tether log --oneline -20 2>/dev/null || echo '(git unavailable)'"
    timeout: 5s

  status:
    type: cmd
    run: "cd ~/Projects-apps/tether 2>/dev/null && git status --short -b 2>/dev/null"
    timeout: 5s

  memory:
    type: cmd
    run: |
      echo "[ memory slot: configure vanta recall for scope:torque.engineer.main ]"
    timeout: 3s

  skills:
    type: skill_index
    limit: 6
