id: vanta-conduit.backend.main
display_name: "Vanta Conduit — Backend"

identity:
  lineage_alias:   vanta-conduit.backend.main
  lineage_id:      ""
  profile_id:      vanta-conduit-backend
  profile_version: 1
  role:            backend
  project:         vanta-conduit
  work_root:       ~/Projects-apps/vanta-conduit
  tracking_root:   ~/Projects-apps/agent-workspaces/execution/vanta-conduit/
  vanta_primary:   "2026-04-19"

slots:
  agent:
    type: static
    path: ~/.nanite/roles/domain/backend.md

  recap:
    type: cmd
    run: |
      if [ -f "$HOME/Projects-apps/agent-workspaces/boot/vanta-conduit/boot-prompt.md" ]; then
        head -80 "$HOME/Projects-apps/agent-workspaces/boot/vanta-conduit/boot-prompt.md"
      else
        echo "(no recap available)"
      fi
    timeout: 5s

  history:
    type: cmd
    run: "git -C ~/Projects-apps/vanta-conduit log --oneline -20 2>/dev/null || echo '(git unavailable)'"
    timeout: 5s

  status:
    type: cmd
    run: "cd ~/Projects-apps/vanta-conduit 2>/dev/null && git status --short -b 2>/dev/null"
    timeout: 5s

  memory:
    type: cmd
    run: echo "[ memory slot: configure vanta recall for scope:vanta-conduit.backend.main ]"
    timeout: 3s

  skills:
    type: static
    path: ~/.nanite/skills/
    glob: "*.md"
    limit: 6
