id: agent-mux.engineer.main
display_name: "Agent Mux — Engineer"

identity:
  lineage_alias:   agent-mux.engineer.main
  lineage_id:      ""
  profile_id:      agent-mux-engineer
  profile_version: 1
  role:            backend
  project:         agent-mux
  work_root:       ~/Projects-apps/agent-mux
  tracking_root:   ~/Projects-apps/agent-workspaces/execution/agent-mux/
  vanta_primary:   "2026-04-19"

slots:
  agent:
    type: static
    path: ~/.nanite/roles/domain/backend.md

  recap:
    type: cmd
    run: |
      if [ -f "$HOME/Projects-apps/agent-workspaces/boot/agent-mux/boot-prompt.md" ]; then
        head -80 "$HOME/Projects-apps/agent-workspaces/boot/agent-mux/boot-prompt.md"
      else
        echo "(no recap available)"
      fi
    timeout: 5s

  history:
    type: cmd
    run: "git -C ~/Projects-apps/agent-mux log --oneline -20 2>/dev/null || echo '(git unavailable)'"
    timeout: 5s

  status:
    type: cmd
    run: "cd ~/Projects-apps/agent-mux 2>/dev/null && git status --short -b 2>/dev/null"
    timeout: 5s

  # memory_recall namespace=user/$USER/memory tags=["scope:agent-mux.engineer.main"] limit=20
  memory:
    type: cmd
    run: |
      echo "[ memory slot: configure vanta recall for scope:agent-mux.engineer.main ]"
    timeout: 3s

  skills:
    type: static
    path: ~/.nanite/skills/
    glob: "*.md"
    limit: 6
