id: agent-mux.engineer.main
display_name: "Tether — Engineer"
# v005-08: per-profile MCP allowlist. Empty/omitted = proxy default (all).
mcp_servers: []

identity:
  lineage_alias:   agent-mux.engineer.main
  lineage_id:      ""
  profile_id:      agent-mux-engineer
  profile_version: 1
  role:            backend
  project:         agent-mux
  work_root:       ~/dev/hollis-labs/apps/tether
  tracking_root:   ~/dev/hollis-labs/agent-workspaces/execution/tether/
  tesseract_primary:   "2026-04-19"

slots:
  agent:
    type: role_summary
    path: ~/.nanite/roles/domain/backend/worker.md

  recap:
    type: cmd
    run: |
      if [ -f "$HOME/dev/hollis-labs/agent-workspaces/boot/tether/boot-prompt.md" ]; then
        head -80 "$HOME/dev/hollis-labs/agent-workspaces/boot/tether/boot-prompt.md"
      else
        echo "(no recap available)"
      fi
    timeout: 5s

  history:
    type: cmd
    run: "git -C ~/dev/hollis-labs/apps/tether log --oneline -20 2>/dev/null || echo '(git unavailable)'"
    timeout: 5s

  status:
    type: cmd
    run: "cd ~/dev/hollis-labs/apps/tether 2>/dev/null && git status --short -b 2>/dev/null"
    timeout: 5s

  # memory_recall namespace=user/$USER/memory tags=["scope:agent-mux.engineer.main"] limit=20
  memory:
    type: cmd
    run: |
      echo "[ memory slot: configure vanta recall for scope:agent-mux.engineer.main ]"
    timeout: 3s

  skills:
    type: skill_index
    limit: 6
