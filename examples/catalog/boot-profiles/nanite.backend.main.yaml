id: nanite.backend.main
display_name: "Nanite Backend"

# Boot profile for the Nanite backend engineer role.
# scope_key: nanite.backend.main
#
# Usage:
#   mux generate-boot nanite.backend.main | claude --dangerously-skip-permissions
#
# Slot sources — customize to match your setup.

slots:
  # agent: the role definition file for this persona.
  agent:
    type: static
    path: "~/.nanite/roles/backend/backend.md"

  # memory: recent canonical records from Vanta scoped to this agent.
  # Uses the vanta CLI or a custom script that calls the Vanta API.
  memory:
    type: cmd
    run: |
      # Replace with your Vanta recall command, e.g.:
      # vanta recall --namespace user/$USER/memory --tag scope:nanite.backend.main --limit 15 --format markdown
      # Or a local script:
      # ~/.agent-mux/scripts/vanta-recall.sh nanite.backend.main
      echo "<!-- memory: configure vanta recall command in this profile -->"
    timeout: 15s

  # recap: most recent session-close records (what changed last session).
  recap:
    type: cmd
    run: |
      # Replace with your session-close recall command, e.g.:
      # vanta recall --namespace user/$USER/knowledge/session-close/nanite --limit 3 --format markdown
      echo "<!-- recap: configure session-close recall command in this profile -->"
    timeout: 15s

  # history: recent git commits in the project repo.
  history:
    type: cmd
    run: "git -C ~/Projects-apps/nanite log --oneline -20 2>/dev/null || echo '(git not available)'"
    timeout: 5s

  # tasks: active Clockwork tasks for this project (requires clockwork CLI).
  # tasks:
  #   type: cmd
  #   run: "clockwork tasks list --project nanite --status in_progress --format brief 2>/dev/null"
  #   timeout: 10s

  # skills: available skills for this role.
  skills:
    type: static
    path: "~/.nanite/skills/"
    glob: "*.md"
    limit: 10
