id: clockwork-manifold.engineer.main
display_name: "Clockwork Manifold — Engineer"

identity:
  lineage_alias:   clockwork-manifold.engineer.main
  lineage_id:      ""
  profile_id:      clockwork-manifold-engineer
  profile_version: 1
  role:            backend
  project:         clockwork-manifold
  work_root:       ~/Projects-apps/clockwork-manifold
  tracking_root:   ~/Projects-apps/agent-workspaces/execution/clockwork-manifold/
  vanta_primary:   "2026-04-19"

slots:
  agent:
    type: static
    path: ~/.nanite/roles/domain/backend.md

  recap:
    type: cmd
    run: |
      if [ -f "$HOME/Projects-apps/agent-workspaces/boot/clockwork-manifold/boot-prompt.md" ]; then
        head -80 "$HOME/Projects-apps/agent-workspaces/boot/clockwork-manifold/boot-prompt.md"
      else
        echo "(no recap available)"
      fi
    timeout: 5s

  history:
    type: cmd
    run: "git -C ~/Projects-apps/clockwork-manifold log --oneline -20 2>/dev/null || echo '(git unavailable)'"
    timeout: 5s

  status:
    type: cmd
    run: "cd ~/Projects-apps/clockwork-manifold 2>/dev/null && git status --short -b 2>/dev/null"
    timeout: 5s

  memory:
    type: cmd
    run: |
      echo "[ memory slot: configure vanta recall for scope:clockwork-manifold.engineer.main ]"
    timeout: 3s

  skills:
    type: skill_index
    limit: 6
