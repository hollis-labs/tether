id: claude-code
type: cli
provider: claude
runtime_kind: streaming-stdio
command: claude
args: []
bootstrap:
  # streaming-stdio: the daemon launches Claude in NDJSON streaming-input
  # mode (`claude -p --input-format stream-json --output-format stream-json
  # --verbose`). System context rides via the planted CLAUDE.md /
  # --append-system-prompt-file injection paths from go-providers'
  # BootDirSpec; user turns flow via the daemon's /turn endpoint (or
  # `mux sessions turn`, `mux_session_send_turn`). Per-turn payloads are
  # framed as {"type":"user","message":{"role":"user","content":"..."}}\n
  # by service.SendTurn.
  mode: streaming-stdio
  prompt_prefix: ""
env:
  # Default "merge" inherits the full daemon environment and applies redact +
  # overrides. Flip to "whitelist" for isolation (only the listed passthrough
  # keys are copied in). See internal/provider/env.go.
  mode: merge
  passthrough:
    - HOME
    - PATH
    - SHELL
    - ANTHROPIC_API_KEY
  redact: []
