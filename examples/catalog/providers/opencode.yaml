id: opencode
type: cli
provider: opencode
runtime_kind: subprocess
# command may be a bare name (resolved via your daemon's PATH) or an absolute
# path. Set an absolute path when PATH is not stable for daemon launches.
# Example: command: /usr/local/bin/opencode
command: opencode
args:
  - run
bootstrap:
  mode: prepend
  prompt_prefix: ""
env:
  mode: merge
  passthrough:
    - HOME
    - PATH
    - SHELL
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
  redact:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
