id: claude-pty
type: cli
provider: claude
runtime_kind: pty
command: claude
args: []
bootstrap:
  # pty: the daemon launches Claude as its interactive TUI under a long-lived
  # PTY. Boot context is planted into the boot dir and initial stdin path by
  # go-agent-sessions/go-providers; attach sends raw terminal bytes and resize
  # flows through `mux sessions attach`.
  mode: stdin
  prompt_prefix: ""
env:
  mode: merge
  passthrough:
    - HOME
    - PATH
    - SHELL
    - ANTHROPIC_API_KEY
  redact: []
