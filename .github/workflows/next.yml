name: next

# The Substrate port (CW-20261112-0101): the nested module next/ has its own gate (Substrate adoption
# guide section 12). The old tree keeps its own CI (ci.yml), which the branch must also keep green.
on:
  pull_request:
    branches: [substrate-port]
  push:
    branches: [substrate-port]

permissions:
  contents: read

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: next/ vet / pins / test-race / lint / scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    # The Postgres leg (port plan 13.1(3)): a throwaway Postgres 17 for the dialect tests. Trust auth on a
    # container that exists only for this job, so no credential is involved.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUBSTRATE_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the hygiene scan compares against the base ref
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - run: go vet ./...
      - name: pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: generated wiring is current
        run: |
          go run github.com/hollis-labs/substrate/cmd/substrate generate -f cmd/tether/substrate.yaml
          git diff --exit-code -- cmd/tether/substrate_wiring.go
      - run: go test -race ./...
      - name: the Postgres leg ran (a skip here is a failure)
        run: go test -count=1 -v -run 'TestPostgresSchemaMatchesSQLite|TestTriggerParity|TestMessagesSeqAcceptance' ./internal/migrate | tee /tmp/pg-leg.txt && ! grep -q -- '--- SKIP' /tmp/pg-leg.txt
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: next
      - name: hygiene (no finding the base does not already have)
        run: scripts/scan-new.sh "origin/${{ github.base_ref || 'substrate-port' }}" HEAD
