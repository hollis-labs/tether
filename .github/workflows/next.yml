name: next

# The Substrate port (CW-20261112-0101): the nested module next/ has its own gate (Substrate adoption
# guide section 12). The old tree keeps its own CI (ci.yml), which the branch must also keep green.
on:
  pull_request:
    branches: [substrate-port]
  push:
    branches: [substrate-port]

permissions:
  contents: read

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: next/ vet / pins / test-race / lint / scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the hygiene scan compares against the base ref
      - uses: actions/setup-go@v6
        with:
          go-version-file: next/go.mod
          cache-dependency-path: next/go.sum
      - run: go vet ./...
      - name: pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - name: generated wiring is current
        run: |
          go run github.com/hollis-labs/substrate/cmd/substrate generate -f cmd/tether/substrate.yaml
          git diff --exit-code -- cmd/tether/substrate_wiring.go
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: next
      - name: hygiene (no finding the base does not already have)
        run: scripts/scan-new.sh "origin/${{ github.base_ref || 'substrate-port' }}" HEAD
