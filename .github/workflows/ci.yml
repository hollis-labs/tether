name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 09:00 UTC — re-runs the full gate (including govulncheck)
    # so newly-disclosed vulns in dependencies get caught between pushes.
    - cron: '0 9 * * 1'

permissions:
  contents: read

env:
  # The store package's race tests run in their own job (test-race-store) so the
  # main job stays well under its limit; the main job runs every other package.
  STORE_PKG: github.com/hollis-labs/tether/internal/store
  # Workaround: internal/app can need more than go test's 10 minute per-package
  # default under -race with coverage on the runner. The Makefile reads this.
  TEST_TIMEOUT: 20m

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt / vet / lint / test-race / vuln
    runs-on: ubuntu-latest
    # Allow the 20-minute per-package test budget plus tool setup, compilation
    # and remaining quality checks; the job must not cancel before tests report.
    timeout-minutes: 35
    env:
      # hollis-labs/go-messaging and hollis-labs/go-providers are private.
      # GOPRIVATE skips the proxy and sum database for these modules.
      # GONOSUMDB is the correct env var name (GONOSUMCHECK does not exist).
      GOPRIVATE: "github.com/hollis-labs/*"
      GONOSUMDB: "github.com/hollis-labs/*"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Honors both the `go` and `toolchain` directives in go.mod so CI
          # tracks the same toolchain developers use locally.
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        # Scope the rewrite to hollis-labs/ only — not all of github.com —
        # to minimise PAT exposure surface.
        # GH_PAT must be a classic PAT with `repo` scope set as a repository secret.
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}:x-oauth-basic@github.com/hollis-labs/".insteadOf "https://github.com/hollis-labs/"

      - name: Install developer tools
        run: make tools-install

      - name: Install bubblewrap
        # Every agent launch runs under a protecting sandbox (bwrap on
        # Linux; CW-20261001-0142), and the end-to-end protection test needs
        # one. NOTE: on ubuntu-latest that test still SKIPS itself, because
        # AppArmor stops bwrap creating a user namespace even once installed
        # ("setting up uid map: Permission denied"), so CI does not exercise
        # it. Installing bubblewrap here only helps on a runner that allows it.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run full quality gate
        # Every package except the store package, which test-race-store runs.
        run: make check RACE_PKGS="$(go list ./... | grep -v -F -x "$STORE_PKG" | tr '\n' ' ')"

  test-race-store:
    name: test-race (store)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOPRIVATE: "github.com/hollis-labs/*"
      GONOSUMDB: "github.com/hollis-labs/*"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}:x-oauth-basic@github.com/hollis-labs/".insteadOf "https://github.com/hollis-labs/"

      - name: Install gotestsum
        # Same tool and version spec as `make tools-install`.
        run: go install gotest.tools/gotestsum@latest

      - name: Run the store race tests
        # Same flags as the main job's race run, for this one package.
        run: make test-race RACE_PKGS="$STORE_PKG"
