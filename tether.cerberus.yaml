kind: cerberus-project/v1
owner: tether
namespace: local
project:
  id: tether
  name: Tether
resources:
  - id: tether-daemon-service
    name: Tether Daemon Service
    type: process
    project: tether
    connector: local
    config:
      build_strategy:
        kind: make_standard
        # Both rules are required, for different reasons.
        #
        # target: make_standard otherwise runs `make install`, and this
        # Makefile's install target follows the BSD/GNU convention into
        # $(PREFIX)/bin = /usr/local/bin, which needs root — deploy failed
        # with "install: chmod 755 /usr/local/bin: Operation not permitted".
        # Cerberus installs the artifact into its own install_root itself,
        # so it wants a BUILD, not a system install.
        #
        # output: `make build` emits two binaries (bin/mux and
        # bin/mux-apikey-helper), so deploy must be told which one IS the
        # service. Without it, deploy refuses with "artifact deployment
        # requires build_strategy.rules.output naming the binary the build
        # produces; command[0] is not a build-output contract" — command[0]
        # is a path to run, not a contract about what the build emits.
        rules:
          target: build
          # bin/mux, NOT mux: rules.output resolves against the BUILD DIR
          # (the repo root here), not against wherever the Makefile happens
          # to write. A bare `mux` resolved to <repo>/mux — a stale,
          # gitignored binary left over from an earlier `go build -o mux`,
          # which deploy then activated and reported as success while the
          # daemon kept running five-day-old code. Keep this pointed at the
          # path `make build` actually writes.
          output: bin/mux
      command:
        - ./bin/mux
        - daemon
        - run
        - --catalog
        - ~/.tether/catalog
      # Relative to this file: the checkout, wherever it is on the host.
      dir: .
      env:
        # PREFIX redirects `make install` away from /usr/local/bin.
        # Cerberus's artifact install step always runs `make install` when a
        # Makefile is present (internal/connector/local/install.go), and it
        # passes this env through. This Makefile's install target honors
        # PREFIX/BINDIR/DESTDIR per BSD/GNU convention, whose default
        # /usr/local needs root — deploy failed with "install: chmod 755
        # /usr/local/bin: Operation not permitted".
        #
        # Pointing it at Cerberus's own install_root keeps the side effect
        # inside the directory Cerberus already owns. Deliberately NOT
        # ~/.local, which precedes ~/go/bin on PATH here and would shadow
        # the `mux` CLI with a copy deploy happens to have built.
        PREFIX: ~/.cerberus/apps/tether/tether-daemon-service
        # No HOME, PATH or SHELL: the supervisor provides HOME and the
        # user's login SHELL, and Cerberus gives the plist or unit the PATH
        # its daemon runs with (composed by `cerberus install` from the
        # installing shell), so agent CLIs resolve on whichever host this is
        # registered.
      mode: os_service
      run_from: artifact
      supervisor: auto
    tags:
      - daemon
      - mcp
      - go
      - launchd
      - v2
  - id: tether-dev
    name: Tether (Dev)
    type: process
    project: tether
    connector: local
    config:
      auto_restart: false
      auto_start: true
      command:
        - make
        - run
      dir: apps/sysop
      mode: dev_session
      port: 8947
      run_from: workspace
      url: http://127.0.0.1:8947/operations/
    tags:
      - frontend
      - go
      - dev
      - workspace
      - v2
  - id: tether-ui-dev
    name: Tether UI (Dev)
    type: process
    project: tether
    connector: local
    config:
      auto_restart: false
      auto_start: false
      command:
        - make
        - ui-dev
      dir: apps/sysop
      mode: dev_session
      port: 5177
      run_from: workspace
      url: http://127.0.0.1:5177/operations/
    tags:
      - frontend
      - vite
      - dev
      - workspace
      - v2
registry_urn: msg://agent/agent-mux/prj_a8melpmw8k
