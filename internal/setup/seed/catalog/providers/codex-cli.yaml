id: codex-cli
type: cli-goprovider
provider: codex
runtime_kind: subprocess
adapter: codex
# Leave command empty to let the adapter auto-detect via $CODEX_CLI_PATH or PATH.
# Set an absolute path here if codex is not on your daemon's PATH.
# Example: command: /usr/local/bin/codex
command: ""
bootstrap:
  mode: agents_md
env:
  mode: merge
  redact:
    - ANTHROPIC_API_KEY
    - CLAUDE_API_KEY
