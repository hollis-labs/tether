version: 1.0.0
identity:
  mode: observe # verifies and attributes; never enables enforcement by default
catalog:
  roots:
    projects: projects
    agents: agents
    providers: providers
    launches: launches
    boot: boot
  defaults:
    state_db: ~/.tether/state/tether.db
    # Agent work and boot directories must be outside protected ~/.tether.
    workspace_root: ~/tether/workspaces
    temp_root: ~/tether/tmp
# The daemon socket + pidfile live under the control-plane state root. Change
# listen_addr to e.g. tcp:127.0.0.1:7180 for debugging.
daemon:
  mcp_upstream_ownership: legacy_proxy # opt in to daemon after enabling its MCP endpoint
  listen_addr: unix:~/.tether/run/tetherd.sock
  pid_file: ~/.tether/run/tetherd.pid
  shutdown_timeout: 10s
  mcp_endpoint:
    enabled: false # Opt in to verified /mcp and /p/<profile> over this listener.
  events_retention:
    enabled: true
    days: 90 # Set below 1 to disable age-based event retention.
